<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1269d3"><meta name="mobile-web-app-capable" content="yes">
  <title>Math AAC Workspace</title>
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=32">
</head>
<body>
  <header class="topbar">
    <strong class="brand">MATH AAC</strong>
    <nav class="main-tabs" aria-label="Workspace">
      <button class="tab active" aria-pressed="true" data-tab="math">Math</button>
      <button class="tab" aria-pressed="false" data-tab="spell">Letters</button>
      <button class="tab" aria-pressed="false" data-tab="appearance">Appearance</button>
      <button class="tab" aria-pressed="false" data-tab="settings">Settings</button>
    </nav>
  </header>
  <main class="workspace">
    <div class="display-row">
      <input id="display" aria-label="Math and speech bar" autocomplete="off" spellcheck="false" placeholder="Input math to solve or speak">
      <button class="button blue" data-action="speak">Speak</button>
      <button class="button" id="calculator-stop">Stop</button>
      <button class="button" id="calculator-undo" disabled>Undo</button>
      <button class="button" data-action="clear">Clear</button>
      <button class="button green" id="shared-solve">Solve</button>
    </div>
    <div class="result-strip">
      <output id="calculator-result" role="status">Ready.</output>
      <button class="button" id="speak-answer" disabled>Speak answer</button>
      <button class="button" id="shared-use-answer" hidden>Use answer</button>
    </div>
    <div class="editing-location" id="field-context" hidden>
      <span id="editing-location" role="status"></span>
      <button class="button" id="return-to-field">Return to field</button>
      <button class="button" id="finish-field">Done editing field</button>
    </div>
    <section class="subject active" id="math">
      <nav class="sub-tabs" aria-label="Math tools">
        <button class="subtab active" aria-pressed="true" data-subtab="basic">Basic</button>
        <button class="subtab" aria-pressed="false" data-subtab="scientific">Scientific</button>
        <button class="subtab" aria-pressed="false" data-subtab="algebra">Algebra</button>
        <button class="subtab" aria-pressed="false" data-subtab="calculus">Integrals</button>
        <button class="subtab" aria-pressed="false" data-subtab="greek">Greek</button>
        <button class="subtab" aria-pressed="false" data-subtab="discrete">Discrete</button>
        <button class="subtab" aria-pressed="false" data-subtab="functions">Functions</button>
        <button class="subtab" aria-pressed="false" data-subtab="graphing">Graph</button>
      </nav>
      <div class="math-stage" id="math-stage" data-panel="basic">
        <div class="tool-panels">
          <section class="subpanel active" id="basic" aria-label="Basic calculator"></section>
          <section class="subpanel" id="scientific" aria-label="Scientific functions">
            <div class="symbol-grid" data-buttons="functions"></div>
            <div class="symbol-grid science-extra">
              <button class="button" data-value="pi">pi</button><button class="button" data-value="e">e</button>
              <button class="button" data-value="^2">Square</button><button class="button" data-value="^">Power</button>
              <button class="button" data-value="10^" aria-label="Ten to a power">10^x</button><button class="button" data-value="sign(">Sign</button>
              <button class="button" data-value="Ans" aria-label="Last answer">Ans</button><button class="button" data-value="E" aria-label="Scientific notation">EE</button>
              <button class="button" data-value="/100">Percent</button><button class="button" id="calculator-angle" data-action="mode">Radians</button>
            </div>
          </section>
          <section class="subpanel" id="algebra" aria-label="Algebra">
            <div class="symbol-grid" data-buttons="algebra"></div>
            <div class="form-card">
              <div class="field-row"><select id="calculator-template" aria-label="Build an expression"><option value="fraction">Fraction</option><option value="power">Power</option></select><button class="button blue" id="calculator-insert-template">Insert expression</button></div>
              <div class="field-row"><div><label id="template-first-label" for="template-first">Numerator</label><input id="template-first" autocomplete="off"></div><div><label id="template-second-label" for="template-second">Denominator</label><input id="template-second" autocomplete="off"></div></div>
            </div>
          </section>
          <section class="subpanel" id="calculus" aria-label="Integral editor">
            <div class="local-tabs" role="group" aria-label="Integral type"><button class="button" id="integral-indefinite" aria-pressed="false">Indefinite</button><button class="button blue" id="integral-definite" aria-pressed="true">Definite</button></div>
            <div class="integral-editor">
              <span class="integral-sign" aria-hidden="true">&int;</span>
              <div id="integral-bounds" class="bounds"><div><label for="integral-upper">Upper</label><input id="integral-upper" value="1" autocomplete="off"></div><div><label for="integral-lower">Lower</label><input id="integral-lower" value="0" autocomplete="off"></div></div>
              <div class="integrand"><label for="integral-expression">Expression</label><input id="integral-expression" value="x^2" autocomplete="off"></div>
              <div class="variable"><label for="integral-variable">Variable</label><input id="integral-variable" value="x" autocomplete="off"></div>
            </div>
            <div class="button-row"><button class="button green" id="integral-calculate">Solve integral</button><button class="button" data-tool-display="integral-expression">Use bar</button><button class="button" id="integral-example">Example</button></div>
            <output class="tool-result" id="integral-result" role="status">Tap a field to edit.</output>
          </section>
          <section class="subpanel" id="greek" aria-label="Greek letters">
            <div class="symbol-grid greek-grid" id="greek-letters"></div>
            <div class="button-row"><button class="button" id="greek-function">Define with theta</button><button class="button" id="greek-define">Save definition in bar</button></div>
          </section>
          <section class="subpanel" id="discrete" aria-label="Discrete mathematics">
            <label for="discrete-operation">Operation</label><select id="discrete-operation"><option value="sum">Finite sum</option><option value="product">Finite product</option><option value="choose">Combinations</option><option value="permute">Permutations</option><option value="union">Set union</option><option value="intersection">Set intersection</option><option value="difference">Set difference</option><option value="and">Logic AND</option><option value="or">Logic OR</option><option value="implies">Implication</option></select>
            <div id="discrete-series"><div class="field-row"><div><label for="series-expression">Term</label><input id="series-expression" value="k^2"></div><div><label for="series-variable">Index variable</label><input id="series-variable" value="k"></div></div><div class="field-row"><div><label for="series-lower">First index</label><input id="series-lower" value="1"></div><div><label for="series-upper">Last index</label><input id="series-upper" value="5"></div></div></div>
            <div id="discrete-counting" class="field-row" hidden><div><label for="count-n">Total (n)</label><input id="count-n" value="5"></div><div><label for="count-r">Selected (r)</label><input id="count-r" value="2"></div></div>
            <div id="discrete-sets" hidden><label for="set-a">Set A (comma separated)</label><input id="set-a" value="1, 2, 3"><label for="set-b">Set B</label><input id="set-b" value="2, 3, 4"></div>
            <div id="discrete-logic" class="field-row" hidden><div><label for="logic-p">Statement p</label><select id="logic-p"><option value="true">True</option><option value="false">False</option></select></div><div><label for="logic-q">Statement q</label><select id="logic-q"><option value="true">True</option><option value="false">False</option></select></div></div>
            <div class="button-row"><button class="button green" id="discrete-calculate">Calculate</button><button class="button" data-result-to-bar="discrete-result">Send result to bar</button></div><output class="tool-result" id="discrete-result" role="status">Choose an operation.</output>
          </section>
          <section class="subpanel" id="functions" aria-label="Named functions">
            <nav class="local-tabs" aria-label="Function task"><button class="button active" aria-pressed="true" data-page="function-define">Define</button><button class="button" aria-pressed="false" data-page="function-evaluate">Evaluate</button><button class="button" aria-pressed="false" data-page="function-compose">Compose</button></nav>
            <div class="tool-page active" id="function-define"><div class="field-row"><div><label for="function-name">Name</label><input id="function-name" value="f"></div><div><label for="function-parameters">Variables</label><input id="function-parameters" value="x"></div></div><label for="function-rule">Rule</label><input id="function-rule" placeholder="2x+3"><div class="button-row"><button class="button green" id="save-function">Save function</button><button class="button" id="show-functions">List saved functions</button></div></div>
            <div class="tool-page" id="function-evaluate"><label for="saved-function">Saved function</label><select id="saved-function"></select><label for="function-arguments">Evaluate at</label><input id="function-arguments" placeholder="5"><div class="button-row"><button class="button green" id="evaluate-function">Evaluate</button><button class="button" id="edit-function">Edit rule</button><button class="button" id="use-function">Use in calculator</button><button class="button" id="insert-function">Insert call</button></div></div>
            <div class="tool-page" id="function-compose"><p class="hint">Choose the outer function and input on Evaluate.</p><label for="compose-function">Inner function</label><select id="compose-function"></select><button class="button green" id="evaluate-composition">Evaluate composition</button></div>
            <output class="tool-result" id="function-result" role="status">Define a function to begin.</output>
          </section>
          <section class="subpanel" id="graphing" aria-label="Graphing">
            <nav class="local-tabs" aria-label="Graph task"><button class="button active" aria-pressed="true" data-page="graph-plot-page">Plot</button><button class="button" aria-pressed="false" data-page="graph-window-page">Window</button></nav>
            <div class="tool-page active" id="graph-plot-page"><div class="field-row"><div><label for="graph-expression">y =</label><input id="graph-expression" value="x^2"></div><div><label for="graph-function">Saved function</label><select id="graph-function"><option value="">Choose a function</option></select></div><button class="button green" id="graph-plot">Plot</button></div><svg id="graph-canvas" viewBox="0 0 720 460" role="img" aria-label="Function graph"></svg><div class="field-row"><div><label for="graph-at">x value</label><input id="graph-at" value="0"></div><button class="button" id="graph-evaluate">Find y</button><button class="button" id="graph-use-display">Use bar</button></div></div>
            <div class="tool-page" id="graph-window-page"><div class="field-row"><div><label for="graph-xmin">x minimum</label><input id="graph-xmin" value="-10"></div><div><label for="graph-xmax">x maximum</label><input id="graph-xmax" value="10"></div></div><div class="field-row"><div><label for="graph-ymin">y minimum</label><input id="graph-ymin" value="-10"></div><div><label for="graph-ymax">y maximum</label><input id="graph-ymax" value="10"></div></div><div class="button-row"><button class="button" id="graph-reset">Reset window</button><button class="button blue" aria-pressed="false" data-page="graph-plot-page" data-plot-return>Back to plot</button></div></div>
            <output class="tool-result" id="graph-result" role="status">Choose Plot.</output>
          </section>
        </div>
        <div class="key-grid" id="workspace-keypad" role="group" aria-label="Number pad">
          <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key action" data-value="/" aria-label="Divide">&divide;</button>
          <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key action" data-value="*" aria-label="Multiply">&times;</button>
          <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key action" data-value="-" aria-label="Subtract">&minus;</button>
          <button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key" data-action="sign" aria-label="Change sign">+/-</button><button class="key action" data-value="+" aria-label="Add">+</button>
          <button class="key" data-value="(">(</button><button class="key" data-value=")">)</button><button class="key secondary" data-action="backspace">Delete</button><button class="key enter" data-action="evaluate">=</button>
        </div>
      </div>
    </section>
    <section class="subject" id="spell" aria-label="Letters"><div class="letter-grid" id="letter-buttons"></div></section>
    <section class="subject" id="appearance" aria-label="Appearance"><div class="settings-grid"><div class="form-card"><label for="theme-select">Color theme</label><select id="theme-select"><option value="light">Bright blue</option><option value="high">High contrast</option><option value="warm">Warm</option></select><label for="size-range">Text size</label><input id="size-range" type="range" min="16" max="24" value="18"></div><div class="form-card"><label class="check"><input type="checkbox" id="calculator-still" checked> Keep buttons still</label><label class="check"><input type="checkbox" id="calculator-preview" checked> Show answers while typing</label><p class="hint">Large keys stay in the same place on every math tool.</p></div></div></section>
    <section class="subject" id="settings" aria-label="Speech settings"><div class="settings-grid"><div class="form-card"><label for="kokoro-voice">Local neural voice (Kokoro)</label><select id="kokoro-voice"><option value="af_heart">Heart</option><option value="af_bella">Bella</option><option value="af_sarah">Sarah</option><option value="am_adam">Adam</option><option value="am_michael">Michael</option><option value="bf_emma">Emma</option><option value="bf_isabella">Isabella</option><option value="bm_george">George</option><option value="bm_lewis">Lewis</option></select><label for="voice-select">Installed device fallback voice</label><select id="voice-select"></select></div><div class="form-card"><label for="rate-range">Speech speed</label><input id="rate-range" type="range" min="100" max="240" value="175"><label for="volume-range">Volume</label><input id="volume-range" type="range" min="30" max="100" value="100"><button class="button blue" data-action="test-voice">Test voice</button><p class="engine-status hint"></p></div></div></section>
    <p class="status" id="status" role="status" aria-live="polite">Ready.</p>
  </main>
  <script src="app.js?v=32"></script><script>initializeSettings();</script>
  <script src="functions.js?v=32"></script><script src="workspace.js?v=32"></script>
</body>
</html>
